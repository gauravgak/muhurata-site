<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kundli — Muhurata</title>
<link rel="icon" href="muhurata-lotus.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.74.0/dist/umd/supabase.min.js" crossorigin="anonymous"></script>
<script src="auth.js"></script>
<script src="api.js"></script>
<script src="profile.js"></script>
<script src="cities.js"></script>
<script src="wheelpicker.js"></script>
<style>
:root{
  --wall:#171410; --wall-lit:#2c2620; --wall-shade:#0f0d0a;
  --oxide:#9E4A34; --oxide-dk:#7F3728;
  --teak:#d6a754; --teak-dk:#f6efe1;
  --brass:#d6a754; --brass-lt:#f0cd85;
  --marigold:#e0b76a; --kumkum:#d4564c;
  --ink:#f0e7d6; --rule:rgba(214,167,84,.18);
}
*{box-sizing:border-box}
body{margin:0;background:var(--wall);color:var(--ink);
  font-family:"Karla",system-ui,sans-serif;font-size:16px;line-height:1.6}
h1,h2,h3,.serif{font-family:var(--font-heading,Georgia,serif);font-weight:400}
.wrap{max-width:1080px;margin:0 auto;padding:0 20px}
.glyph{width:1em;height:1em;vertical-align:-0.12em;fill:none;stroke:currentColor;
  stroke-width:1.5;display:inline-block}

/* header */
header{padding:22px 0 4px;position:relative;text-align:center}
.mh-logo{display:inline-flex;align-items:center;gap:9px;text-decoration:none;color:var(--teak-dk)}
.mh-logo .brand{font-family:var(--font-heading,Georgia,serif);font-size:22px}
.mh-title{font-size:40px;margin:18px 0 4px;color:var(--brass-lt);text-shadow:0 0 30px rgba(214,167,84,.35);
  background:linear-gradient(90deg,var(--kumkum),var(--brass));-webkit-background-clip:text;
  background-clip:text;-webkit-text-fill-color:transparent}
.mh-sub{color:var(--teak);font-size:15px;margin:0 0 22px}
.theme-btn{position:absolute;top:22px;right:20px;width:38px;height:38px;border-radius:50%;
  border:1px solid var(--rule);background:rgba(44,38,32,.6);cursor:pointer;color:var(--brass)}

/* tab bar */
.tabbar{display:flex;gap:2px;overflow-x:auto;border-bottom:1px solid var(--rule);
  scrollbar-width:none;margin-bottom:26px}
.tabbar::-webkit-scrollbar{display:none}
.tab{flex:1;min-width:max-content;padding:13px 12px;font:inherit;font-size:15px;font-weight:600;text-align:center;
  background:none;border:0;border-bottom:2px solid transparent;color:#7B6551;cursor:pointer;
  white-space:nowrap;transition:color .2s ease,border-bottom-color .25s cubic-bezier(.2,.7,.3,1)}
.tab.on{color:var(--brass-lt);border-bottom-color:var(--brass-lt);text-shadow:0 0 10px rgba(214,167,84,.3)}

/* panels */
.panel{display:none;animation:fade .3s ease both;padding-bottom:60px}
.panel.on{display:block}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* cards + grids */
.card{background:var(--wall-lit);border:1px solid var(--rule);border-radius:8px;box-shadow:0 0 0 1px rgba(0,0,0,.3),0 12px 32px rgba(0,0,0,.4),inset 0 1px 0 rgba(240,205,133,.08);
  padding:20px 22px;margin-bottom:16px}
.card h3{font-size:19px;margin:0 0 14px;color:var(--teak-dk)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:8px 16px;font-size:14.5px}
.kv .k{color:var(--brass);text-transform:uppercase;font-size:11.5px;letter-spacing:1px;
  align-self:center}
.kv .v{color:var(--teak-dk);font-weight:600;text-align:right}

/* tables */
.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.tbl th{text-align:left;color:var(--brass);font-size:11px;letter-spacing:1px;
  text-transform:uppercase;padding:8px 8px 8px 0;border-bottom:1px solid var(--rule);font-weight:600}
.tbl td{padding:9px 8px 9px 0;border-bottom:1px solid rgba(106,68,35,.1);color:var(--teak-dk)}
.tbl td:first-child{font-weight:600}
.rx{color:var(--kumkum);font-size:10px;vertical-align:super}
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch}

/* charts */
.chart-wrap{display:flex;justify-content:center;flex-wrap:wrap;gap:20px}
.chart-wrap svg{max-width:100%;height:auto}
.chart-tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.chip{padding:7px 14px;border:1px solid var(--rule);border-radius:999px;background:var(--wall-lit);
  color:var(--teak);font:inherit;font-size:13px;cursor:pointer;transition:all .18s ease}
.chip.on{background:var(--brass);border-color:var(--brass);color:#171410}

/* divisional chart mini */
.dv-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.dv{background:var(--wall-lit);border:1px solid var(--rule);border-radius:8px;padding:14px;box-shadow:inset 0 0 20px rgba(214,167,84,.06)}
.dv h4{margin:0 0 3px;font-size:15px;color:var(--kumkum);
  font-family:var(--font-heading,Georgia,serif);font-weight:400}
.dv .meaning{font-size:12px;color:#7B6551;margin:0 0 10px}
.dv-signs{display:grid;grid-template-columns:1fr 1fr;gap:3px 10px;font-size:12.5px}
.dv-signs .p{color:var(--teak-dk);font-weight:600}
.dv-signs .s{color:#7B6551;text-align:right}

/* ashtakvarga bar row */
.av-row{display:flex;align-items:center;gap:10px;margin-bottom:7px;font-size:13px}
.av-row .sname{width:80px;color:var(--teak-dk);font-weight:600}
.av-bar{display:block;flex:1;height:18px;background:rgba(214,167,84,.12);border-radius:3px;overflow:hidden;position:relative}
.av-fill{display:block;height:100%;background:linear-gradient(90deg,var(--brass),var(--marigold))}
.av-row .num{width:28px;text-align:right;color:var(--brass);font-weight:700}

/* predictions */
.pred-tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
.pred-body{font-size:15.5px;line-height:1.7;color:var(--teak-dk);white-space:pre-wrap}
.pred-loading{color:#7B6551;font-size:14.5px}
.pred-note{margin-top:18px;font-size:12.5px;color:#7B6551;border-left:3px solid var(--marigold);
  padding-left:12px}

/* dasha cards */
.dasha-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.dasha-card{background:var(--wall-lit);border:1px solid var(--rule);border-radius:6px;padding:12px 14px}
.dasha-card.active{border-color:var(--brass-lt);box-shadow:0 0 0 1px var(--brass-lt),0 0 14px rgba(214,167,84,.25)}
.dasha-card b{font-family:var(--font-heading,Georgia,serif);font-weight:400;font-size:16px;
  color:var(--teak-dk);display:block}
.dasha-card .dates{font-size:12px;color:#7B6551;margin-top:2px}
.dasha-card .tag{font-size:10px;color:var(--kumkum);font-weight:700;letter-spacing:1px}

/* form (before results load) */
.form-card{max-width:460px;margin:30px auto;background:rgba(44,38,32,.82);border:1px solid rgba(214,167,84,.3);
  border-top:3px solid var(--brass);border-radius:8px;padding:26px 24px;box-shadow:0 0 0 1px rgba(0,0,0,.3),0 18px 40px rgba(0,0,0,.45),inset 0 1px 0 rgba(240,205,133,.14)}
.field{margin-bottom:14px}
.field label{display:block;font-size:14px;font-weight:600;margin-bottom:5px;color:var(--teak)}
.field input{width:100%;height:46px;padding:0 12px;font:inherit;font-size:16px;color:var(--ink);
  background:rgba(0,0,0,.25);border:1px solid rgba(214,167,84,.28);border-radius:3px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.go{width:100%;height:50px;font:inherit;font-size:16.5px;font-weight:700;color:#FFF6E2;
  background:var(--kumkum);border:0;border-radius:2px;cursor:pointer}
.err{color:var(--kumkum);font-size:14px;margin-top:10px}
.hide{display:none}
.spin{display:inline-block;width:16px;height:16px;border:2px solid rgba(255,255,255,.4);
  border-top-color:#fff;border-radius:50%;animation:sp .7s linear infinite;vertical-align:-3px;margin-right:8px}
@keyframes sp{to{transform:rotate(360deg)}}

@media (max-width:720px){
  .grid2{grid-template-columns:1fr}
  .dv-grid{grid-template-columns:1fr}
  .mh-title{font-size:30px}
}

/* pointer glow trail */
#glow-trail{position:fixed;top:0;left:0;width:280px;height:280px;pointer-events:none;z-index:9999;
  border-radius:50%;transform:translate(-50%,-50%);opacity:0;transition:opacity .4s ease;
  background:radial-gradient(circle,rgba(233,166,59,.28),rgba(216,180,87,.10) 40%,transparent 70%);
  mix-blend-mode:screen}
[data-theme="dark"] #glow-trail{mix-blend-mode:screen;
  background:radial-gradient(circle,rgba(233,166,59,.28),rgba(216,180,87,.10) 40%,transparent 70%)}
@media (hover:none){#glow-trail{width:200px;height:200px}}

/* chart SVGs on night ground */
.chart-wrap svg rect[fill="#FFFCF3"]{fill:#1f1a14}
.chart-wrap svg text[fill="#3D2514"]{fill:#f0e7d6}
.chart-wrap svg text[fill="#A9801F"]{fill:#d6a754}

header{position:relative;overflow:hidden}
header::before{content:"";position:absolute;top:-120px;left:50%;width:500px;height:500px;
  transform:translateX(-50%);border-radius:50%;pointer-events:none;
  background:radial-gradient(circle,rgba(214,167,84,.12),rgba(214,167,84,.04) 40%,transparent 65%);z-index:0}
header *{position:relative;z-index:1}

/* Naksha widget on kundli page */
.nk-fab{position:fixed;bottom:22px;right:22px;width:58px;height:58px;border-radius:50%;
  background:var(--wall-lit);border:1px solid var(--rule);cursor:pointer;z-index:150;
  box-shadow:0 10px 26px -10px rgba(0,0,0,.5);padding:9px;
  animation:nkbreathe 3.6s ease-in-out infinite}
.nk-fab svg{width:100%;height:100%}
.nk-fab.is-hidden{display:none}
.nk-fab::before{content:"";position:absolute;inset:-6px;border-radius:50%;z-index:-1;
  background:radial-gradient(circle,rgba(233,166,59,.6),rgba(216,180,87,.22) 55%,transparent 72%);
  animation:nk-glow 2.8s ease-in-out infinite}
@keyframes nkbreathe{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
@keyframes nk-glow{0%,100%{opacity:.5;transform:scale(1)}50%{opacity:1;transform:scale(1.18)}}
@keyframes nk-bubble-in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

.nk-panel{position:fixed;bottom:22px;right:22px;width:370px;max-width:calc(100vw - 32px);
  height:min(560px, calc(100vh - 100px));background:var(--wall-lit);border:1px solid var(--rule);
  border-radius:14px;box-shadow:0 24px 60px -18px rgba(0,0,0,.5),0 0 20px rgba(214,167,84,.12);
  z-index:151;display:none;flex-direction:column;overflow:hidden}
.nk-panel.is-open{display:flex;animation:nk-panel-in .28s cubic-bezier(.2,.8,.3,1) both}
@keyframes nk-panel-in{from{opacity:0;transform:translateY(14px) scale(.96)}to{opacity:1;transform:none}}

.nk-head{flex:none;display:flex;align-items:center;gap:11px;padding:14px;border-bottom:1px solid var(--rule)}
.nk-head-mark{width:34px;height:34px;flex:none}
.nk-head-txt{display:flex;flex-direction:column;line-height:1.25}
.nk-head-txt b{font-family:var(--font-heading,Georgia,serif);font-weight:400;font-size:18px;color:var(--brass-lt)}
.nk-head-txt span{font-size:11.5px;color:var(--brass);letter-spacing:.4px}
.nk-close{margin-left:auto;background:none;border:0;font-size:26px;line-height:1;color:var(--brass);cursor:pointer;padding:0 4px}
.nk-body{flex:1;min-height:0;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:10px}
.nk-msg{max-width:86%;padding:10px 13px;border-radius:12px;font-size:14.5px;line-height:1.55;animation:nk-bubble-in .32s ease both}
.nk-msg p{margin:0}
.nk-msg.nk-bot{align-self:flex-start;background:rgba(44,38,32,.8);color:var(--ink);border-bottom-left-radius:3px}
.nk-msg.nk-user{align-self:flex-end;background:var(--brass);color:#171410;border-bottom-right-radius:3px}
.nk-msg.nk-typing{align-self:flex-start;background:rgba(44,38,32,.8);padding:12px 16px}
.nk-dots{display:inline-flex;gap:4px}
.nk-dots i{width:6px;height:6px;border-radius:50%;background:var(--brass);display:block;animation:nkdot 1.2s ease-in-out infinite}
.nk-dots i:nth-child(2){animation-delay:.15s}
.nk-dots i:nth-child(3){animation-delay:.3s}
@keyframes nkdot{0%,60%,100%{opacity:.3}30%{opacity:1}}

.nk-chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:2px}
.nk-chips-inline{margin-top:6px;animation:nk-bubble-in .35s ease both}
.nk-chip{font:inherit;font-size:13px;padding:7px 12px;border-radius:999px;
  border:1px solid var(--rule);background:var(--wall-lit);color:var(--brass);cursor:pointer;
  transition:border-color .18s ease,transform .12s ease}
.nk-chip:hover{border-color:var(--brass);transform:translateY(-1px)}
.nk-chip:active{transform:scale(.97)}
.nk-quota{flex:none;padding:4px 14px;font-size:11.5px;color:rgba(214,167,84,.5);text-align:center}
.nk-input-row{flex:none;display:flex;gap:8px;padding:12px 14px;border-top:1px solid var(--rule)}
#nk-input{flex:1;height:42px;padding:0 12px;font:inherit;font-size:14.5px;color:var(--ink);
  background:rgba(0,0,0,.25);border:1px solid rgba(214,167,84,.28);border-radius:999px}
#nk-input:focus{outline:2px solid var(--marigold);outline-offset:1px}
.nk-send{width:42px;height:42px;border-radius:50%;background:var(--brass);color:#171410;
  border:0;cursor:pointer;display:flex;align-items:center;justify-content:center;flex:none}
.nk-send:hover{background:var(--brass-lt)}
.nk-send:disabled{opacity:.5}
.nk-upsell{background:rgba(44,38,32,.8);border:1px solid var(--rule);border-radius:8px;padding:12px 14px;font-size:13.5px;color:var(--ink)}
.nk-upsell b{display:block;font-family:var(--font-heading,Georgia,serif);font-weight:400;color:var(--brass-lt);font-size:15px;margin-bottom:4px}

@media (max-width:480px){.nk-panel{right:16px;left:16px;width:auto;bottom:16px}}
</style>
<link rel="stylesheet" href="theme.css">
</head>
<body>
<div id="glow-trail"></div>
<div id="glyph-defs"></div>

<header class="wrap">
  <a class="mh-logo" href="/"><span class="brand">Muhurata</span></a>
  <button class="theme-btn" id="thm" aria-label="theme">◐</button>
  <h1 class="mh-title" id="page-title">Free Kundli</h1>
  <p class="mh-sub" id="birth-line">Enter birth details to generate the full chart</p>
</header>

<!-- birth form (shown until a chart loads) -->
<div class="form-card wrap" id="form-card">
  <div class="field"><label for="f-name">Full name</label><input id="f-name" placeholder="Name"></div>
  <div class="field two">
    <div><label>Date of Birth</label><button type="button" class="wp-trigger" data-target="f-dob" data-kind="date">Select date</button><input type="hidden" id="f-dob"></div>
    <div><label>Time of Birth</label><button type="button" class="wp-trigger" data-target="f-tob" data-kind="time">Select time</button><input type="hidden" id="f-tob"></div>
  </div>
  <div class="field"><label for="f-pob">Place of Birth</label><input id="f-pob" placeholder="City"></div>
  <button class="go" id="f-go">Generate Kundli</button>
  <div class="err hide" id="f-err"></div>
</div>

<!-- results -->
<div class="wrap hide" id="results">
  <div class="tabbar" id="tabbar"></div>
  <div id="panels"></div>
</div>

<script>
(function(){
  var $ = function(id){ return document.getElementById(id); };
  function esc(s){ return String(s==null?'':s).replace(/[&<>]/g,function(m){return{'&':'&amp;','<':'&lt;','>':'&gt;'}[m];}); }

  // theme
  (function(){
    var saved; try{ saved=localStorage.getItem('mh-theme'); }catch(e){}
    if(!saved){ try{ saved=matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light'; }catch(e){ saved='light'; } }
    document.documentElement.setAttribute('data-theme',saved);
    $('thm').onclick=function(){
      var n=document.documentElement.getAttribute('data-theme')==='dark'?'light':'dark';
      document.documentElement.setAttribute('data-theme',n);
      try{ localStorage.setItem('mh-theme',n); }catch(e){}
    };
  })();


  // pointer glow trail - follows mouse and touch, eases toward the target
  (function(){
    var g=$('glow-trail'); if(!g) return;
    var tx=0,ty=0,cx=0,cy=0,active=false,raf=null;
    function loop(){
      cx+=(tx-cx)*0.18; cy+=(ty-cy)*0.18;
      g.style.left=cx+'px'; g.style.top=cy+'px';
      if(Math.abs(tx-cx)>0.5||Math.abs(ty-cy)>0.5){ raf=requestAnimationFrame(loop); } else { raf=null; }
    }
    function move(x,y){ tx=x; ty=y; if(!active){active=true;g.style.opacity='1';} if(!raf) raf=requestAnimationFrame(loop); }
    window.addEventListener('mousemove',function(e){ move(e.clientX,e.clientY); },{passive:true});
    window.addEventListener('touchmove',function(e){ var t=e.touches[0]; if(t) move(t.clientX,t.clientY); },{passive:true});
    window.addEventListener('touchstart',function(e){ var t=e.touches[0]; if(t) move(t.clientX,t.clientY); },{passive:true});
    window.addEventListener('mouseleave',function(){ g.style.opacity='0'; active=false; });
  })();

  var ABBR={Sun:'Su',Moon:'Mo',Mars:'Ma',Mercury:'Me',Jupiter:'Ju',Venus:'Ve',Saturn:'Sa',Rahu:'Ra',Ketu:'Ke'};
  function pg(name){ return '<svg class="glyph"><use href="#g-'+name+'"/></svg>'; }
  function sg(sign){ return '<svg class="glyph"><use href="#s-'+sign+'"/></svg>'; }

  // load glyph defs once
  fetch(API_BASE+'/api/glyphs').then(function(r){return r.text();}).then(function(svg){
    $('glyph-defs').innerHTML=svg;
  }).catch(function(){});

  var DATA=null, formData=null;

  // ---------- tab definitions ----------
  var TABS=[
    {id:'basic', label:'Basic', render:renderBasic},
    {id:'kundli', label:'Kundli', render:renderKundli},
    {id:'kp', label:'KP', render:renderKP},
    {id:'ashtakvarga', label:'Ashtakvarga', render:renderAshtak},
    {id:'charts', label:'Charts', render:renderCharts},
    {id:'dasha', label:'Dasha', render:renderDasha},
    {id:'report', label:'Report', render:renderReport},
  ];

  function buildTabs(){
    var bar=$('tabbar'); bar.innerHTML='';
    var panels=$('panels'); panels.innerHTML='';
    TABS.forEach(function(t,i){
      var btn=document.createElement('button');
      btn.className='tab'+(i===0?' on':''); btn.textContent=t.label;
      btn.onclick=function(){ selectTab(t.id); };
      bar.appendChild(btn);
      var p=document.createElement('div');
      p.className='panel'+(i===0?' on':''); p.id='panel-'+t.id;
      panels.appendChild(p);
    });
    // render first
    TABS[0].render($('panel-'+TABS[0].id));
    renderedTabs[TABS[0].id]=true;
  }
  var renderedTabs={};
  function selectTab(id){
    var bar=$('tabbar');
    TABS.forEach(function(t,i){
      bar.children[i].classList.toggle('on', t.id===id);
      $('panel-'+t.id).classList.toggle('on', t.id===id);
    });
    if(!renderedTabs[id]){
      var t=TABS.filter(function(x){return x.id===id;})[0];
      t.render($('panel-'+id));
      renderedTabs[id]=true;
    }
    /* let Naksha notice where you are and offer to explain it */
    clearTimeout(window.__nkNudgeT);
    window.__nkNudgeT = setTimeout(function(){
      if(window.mhNaksha) window.mhNaksha.nudgeForTab(id);
    }, 1500);
  }

  // ---------- BASIC ----------
  function renderBasic(el){
    var d=DATA, a=d.avakhada, pc=d.panchang;
    var birthRows=[
      ['Name', d.name],['Date', d.birth.date],['Time', d.birth.time],
      ['Place', d.birth.place],['Lagna', sg(d.ascendant.sign)+' '+d.ascendant.sign],
      ['Moon Sign', sg(d.moon_sign)+' '+d.moon_sign],['Nakshatra', d.birth_nakshatra],
    ];
    var panchangRows=[
      ['Tithi', pc.tithi],['Yoga', pc.yoga],['Karana', pc.karana],['Nakshatra', pc.nakshatra],
    ];
    var avRows=[
      ['Varna', a.varna],['Vashya', a.vashya],['Yoni', a.yoni],['Gana', a.gana],
      ['Nadi', a.nadi],['Tatva', a.tatva],['Sign Lord', pg(a.sign_lord)+' '+a.sign_lord],
      ['Nakshatra Lord', pg(a.nakshatra_lord)+' '+a.nakshatra_lord],['Charan (Pada)', a.charan],
    ];
    function kvCard(title, rows){
      return '<div class="card"><h3>'+title+'</h3><div class="kv">'+
        rows.map(function(r){return '<div class="k">'+esc(r[0])+'</div><div class="v">'+r[1]+'</div>';}).join('')+
        '</div></div>';
    }
    el.innerHTML='<div class="grid2">'+kvCard('Birth Details',birthRows)+kvCard('Panchang',panchangRows)+'</div>'+
      kvCard('Avakhada Details', avRows);
  }

  // ---------- KUNDLI (rasi + navamsa + positions) ----------
  function renderKundli(el){
    var d=DATA;
    var rows=d.positions.map(function(p){
      return '<tr><td>'+pg(p.name)+' '+esc(p.name)+(p.retrograde?' <span class="rx">R</span>':'')+'</td>'+
        '<td>'+sg(p.sign)+' '+esc(p.sign)+'</td><td>'+esc(p.degree_in_sign)+'</td>'+
        '<td>'+esc(p.nakshatra)+' '+p.pada+'</td><td>'+p.house+'</td></tr>';
    }).join('');
    el.innerHTML=
      '<div class="card"><h3>Lagna Chart (D1) &amp; Navamsa (D9)</h3>'+
      '<div class="chart-tabs" id="k-cht"></div>'+
      '<div class="chart-wrap" id="k-chart"></div></div>'+
      '<div class="card"><h3>Planetary Positions</h3><div class="tw"><table class="tbl">'+
      '<thead><tr><th>Planet</th><th>Sign</th><th>Degree</th><th>Nakshatra</th><th>House</th></tr></thead>'+
      '<tbody>'+rows+'</tbody></table></div></div>';
    var styles=[['north','North Indian'],['south','South Indian'],['navamsa','Navamsa D9']];
    var ct=$('k-cht');
    styles.forEach(function(s,i){
      var b=document.createElement('button'); b.className='chip'+(i===0?' on':''); b.textContent=s[1];
      b.onclick=function(){ for(var j=0;j<ct.children.length;j++) ct.children[j].classList.remove('on'); b.classList.add('on'); $('k-chart').innerHTML=d.charts[s[0]]; };
      ct.appendChild(b);
    });
    $('k-chart').innerHTML=d.charts.north;
  }

  // ---------- KP ----------
  function renderKP(el){
    var d=DATA, rp=d.kp.ruling;
    var rpRows=[
      ['Asc Sign Lord', rp.asc_sign_lord],['Asc Star Lord', rp.asc_star_lord],
      ['Asc Sub Lord', rp.asc_sub_lord],['Moon Sign Lord', rp.moon_sign_lord],
      ['Moon Star Lord', rp.moon_star_lord],['Moon Sub Lord', rp.moon_sub_lord],
    ];
    var planetRows=d.kp.planets.map(function(p){
      return '<tr><td>'+pg(p.planet)+' '+esc(p.planet)+'</td><td>'+p.house+'</td>'+
        '<td>'+esc(p.sign)+'</td><td>'+esc(p.sign_lord)+'</td><td>'+esc(p.nakshatra)+'</td>'+
        '<td>'+esc(p.star_lord)+'</td><td>'+esc(p.sub_lord)+'</td></tr>';
    }).join('');
    el.innerHTML=
      '<div class="card"><h3>Ruling Planets</h3><div class="kv">'+
      rpRows.map(function(r){return '<div class="k">'+esc(r[0])+'</div><div class="v">'+pg(r[1])+' '+esc(r[1])+'</div>';}).join('')+
      '</div></div>'+
      '<div class="card"><h3>KP Planets</h3><div class="tw"><table class="tbl">'+
      '<thead><tr><th>Planet</th><th>House</th><th>Sign</th><th>Sign Lord</th><th>Star</th><th>Star Lord</th><th>Sub Lord</th></tr></thead>'+
      '<tbody>'+planetRows+'</tbody></table></div></div>';
  }

  // ---------- ASHTAKVARGA ----------
  function renderAshtak(el){
    var d=DATA.ashtakvarga;
    var sarvaRows=d.sarva.map(function(x){
      var pct=Math.min(100, (x.bindus/45*100)).toFixed(0);
      return '<div class="av-row"><span class="sname">'+sg(x.sign)+' '+esc(x.sign)+'</span>'+
        '<span class="av-bar"><span class="av-fill" style="width:'+pct+'%"></span></span>'+
        '<span class="num">'+x.bindus+'</span></div>';
    }).join('');
    // bhinna table: planet x 12 signs
    var signs=d.sarva.map(function(x){return x.sign;});
    var head='<th>Planet</th>'+signs.map(function(s){return '<th>'+s.slice(0,3)+'</th>';}).join('');
    var bhinnaRows=Object.keys(d.bhinna).map(function(planet){
      var cells=d.bhinna[planet].map(function(c){return '<td>'+c.bindus+'</td>';}).join('');
      return '<tr><td>'+pg(planet)+' '+esc(planet)+'</td>'+cells+'</tr>';
    }).join('');
    el.innerHTML=
      '<div class="card"><h3>Sarvashtakavarga (total '+d.sarva_total+')</h3>'+
      '<p style="font-size:13px;color:#7B6551;margin:-6px 0 16px">Benefic points per sign — higher means a stronger, more supported area.</p>'+
      sarvaRows+'</div>'+
      '<div class="card"><h3>Bhinnashtakavarga</h3><div class="tw"><table class="tbl">'+
      '<thead><tr>'+head+'</tr></thead><tbody>'+bhinnaRows+'</tbody></table></div></div>';
  }

  // ---------- CHARTS (divisionals) ----------
  function renderCharts(el){
    var d=DATA.divisionals;
    var order=['D1','D9','D2','D3','D7','D10','D12','D30','D60'];
    var cards=order.filter(function(k){return d[k];}).map(function(k){
      var dv=d[k];
      var signs=dv.positions.map(function(p){
        return '<div class="p">'+pg(p.name).replace('class="glyph"','class="glyph" style="width:.9em;height:.9em"')+' '+ABBR[p.name]+'</div><div class="s">'+p.sign+'</div>';
      }).join('');
      return '<div class="dv"><h4>'+k+' · '+esc(dv.name)+'</h4><p class="meaning">'+esc(dv.meaning)+'</p>'+
        '<div style="font-size:12px;color:var(--brass);margin-bottom:8px">Lagna: '+esc(dv.ascendant.sign)+'</div>'+
        '<div class="dv-signs">'+signs+'</div></div>';
    }).join('');
    el.innerHTML='<div class="dv-grid">'+cards+'</div>';
  }

  // ---------- DASHA ----------
  function renderDasha(el){
    var d=DATA, today=new Date().toISOString().slice(0,10);
    var cards=d.vimshottari.map(function(md){
      var active=md.start<=today && today<md.end;
      return '<div class="dasha-card'+(active?' active':'')+'">'+
        (active?'<span class="tag">ACTIVE</span>':'')+
        '<b>'+pg(md.lord)+' '+esc(md.lord)+'</b>'+
        '<div class="dates">'+esc(md.start)+' → '+esc(md.end)+'</div></div>';
    }).join('');
    el.innerHTML='<div class="card"><h3>Vimshottari Mahadasha</h3>'+
      '<p style="font-size:13px;color:#7B6551;margin:-6px 0 16px">Each period is one major life phase, ruled by a planet.</p>'+
      '<div class="dasha-grid">'+cards+'</div></div>';
  }

  // ---------- REPORT (LLM predictions) ----------
  var PRED_SECTIONS=[
    ['personality','Personality'],['career','Career'],['wealth','Wealth'],
    ['relationships','Relationships'],['health','Health'],
  ];
  function renderReport(el){
    el.innerHTML='<div class="card"><h3>Predictions</h3>'+
      '<div class="pred-tabs" id="pred-tabs"></div>'+
      '<div class="pred-body" id="pred-body"><span class="pred-loading">Select a section.</span></div>'+
      '<div class="pred-note">These readings are generated from your actual chart placements. '+
      'They take a few seconds the first time, then are saved.</div></div>';
    var pt=$('pred-tabs');
    PRED_SECTIONS.forEach(function(s,i){
      var b=document.createElement('button'); b.className='chip'+(i===0?' on':''); b.textContent=s[1];
      b.onclick=function(){ for(var j=0;j<pt.children.length;j++) pt.children[j].classList.remove('on'); b.classList.add('on'); loadPrediction(s[0]); };
      pt.appendChild(b);
    });
    loadPrediction(PRED_SECTIONS[0][0]);
  }
  var predCache={};
  function loadPrediction(section){
    var body=$('pred-body');
    if(predCache[section]){ body.textContent=predCache[section]; return; }
    body.innerHTML='<span class="pred-loading">Reading your chart…</span>';
    /* /api/predictions spends LLM tokens, so it needs a signed-in account. */
    window.mhApiFetch(API_BASE+'/api/predictions',{ body:{name:formData.name,dob:formData.dob,tob:formData.tob,place:formData.place,section:section} })
      .then(function(j){ predCache[section]=j.text; body.textContent=j.text; })
      .catch(function(e){
        if(e && e.code==='unauthorized'){
          body.innerHTML='<span class="err">Sign in to read the long-form sections. </span>';
          var b=document.createElement('button'); b.className='pt-btn'; b.textContent='Sign in with Google';
          b.addEventListener('click',function(){ window.mhAuth.signInGoogle(); });
          body.appendChild(b);
        } else {
          body.innerHTML='<span class="err">'+esc((window.MH_ERR&&window.MH_ERR[e.code])||e.message)+'</span>';
        }
      });
  }

  // ---------- load ----------
  function loadKundli(fd){
    formData=fd;
    $('f-go').innerHTML='<span class="spin"></span>Generating…';
    $('f-go').disabled=true; $('f-err').classList.add('hide');
    fetch(API_BASE+'/api/full-kundli',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify(fd)})
      .then(function(r){ return r.json().then(function(j){ if(!r.ok) throw new Error(j.detail||'Could not generate the chart.'); return j; }); })
      .then(function(d){
        DATA=d; renderedTabs={};
        try{
          window.__mhPageContext = {
            name:d.name, dob:(d.birth||{}).date, tob:(d.birth||{}).time, place:(d.birth||{}).place,
            lagna:(d.ascendant||{}).sign, moon_sign:d.moon_sign, nakshatra:d.birth_nakshatra,
            mahadasha:(d.running||{}).mahadasha, antardasha:(d.running||{}).antardasha,
            ishta_devata:(d.ishta_devata||{}).devata,
            positions:(d.positions||[]).map(function(p){ return {name:p.name,sign:p.sign,house:p.house,retro:p.retrograde}; })
          };
        }catch(e){}
        $('page-title').textContent=(d.name||'Your')+"'s Kundli";
        $('birth-line').textContent=d.birth.date+' · '+d.birth.time+' · '+d.birth.place;
        $('form-card').classList.add('hide');
        $('results').classList.remove('hide');
        buildTabs();
        window.scrollTo(0,0);
      })
      .catch(function(e){
        $('f-err').textContent=e.message; $('f-err').classList.remove('hide');
        $('f-go').innerHTML='Generate Kundli'; $('f-go').disabled=false;
      });
  }

  $('f-go').onclick=function(){
    var fd={name:$('f-name').value.trim(),dob:$('f-dob').value,tob:$('f-tob').value,place:$('f-pob').value.trim()};
    if(!fd.name||!fd.dob||!fd.tob||!fd.place){ $('f-err').textContent='Please fill in every field.'; $('f-err').classList.remove('hide'); return; }
    if(window.mhSaveProfile) window.mhSaveProfile(fd);
    loadKundli(fd);
  };

  function _setDT(dob, tob){
    if(window.mhWheelLabel){ if(dob) window.mhWheelLabel('f-dob', dob); if(tob) window.mhWheelLabel('f-tob', tob); }
    else { $('f-dob').value=dob||''; $('f-tob').value=tob||''; }
  }

  // support ?name=&dob=&tob=&place= deep-link (e.g. from the main site form)
  (function(){
    var q=new URLSearchParams(location.search);
    if(q.get('dob')&&q.get('tob')&&q.get('place')){
      var fd={name:q.get('name')||'',dob:q.get('dob'),tob:q.get('tob'),place:q.get('place')};
      $('f-name').value=fd.name; _setDT(fd.dob, fd.tob); $('f-pob').value=fd.place;
      if(fd.name) loadKundli(fd);
    }
  })();

  // prefill from the signed-in user's saved birth details
  function _fillKundli(){
    if(window.mhFillForm) window.mhFillForm({name:'#f-name', place:'#f-pob'});
    if(window.mhProfile) _setDT(window.mhProfile.dob, window.mhProfile.tob);
  }
  _fillKundli();
  window.addEventListener('mh-profile', _fillKundli);
})();
</script>

<button class="nk-fab" id="nk-fab" type="button" aria-label="Chat with Naksha"><svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"><circle cx="46" cy="44" r="32" fill="none" stroke="#d6a754" stroke-width="5"/><path d="M50 24 L57 37 L71 39 L61 49 L63 63 L50 56 L37 63 L39 49 L29 39 L43 37 Z" fill="#e0b76a"/><path d="M50 76 L58 76 L62 88 L50 82 Z" fill="#d6a754"/></svg></button>
<div class="nk-panel" id="nk-panel" role="dialog" aria-label="Naksha chat">
  <div class="nk-head">
    <div class="nk-head-mark"><svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"><circle cx="46" cy="44" r="32" fill="none" stroke="#d6a754" stroke-width="5"/><path d="M50 24 L57 37 L71 39 L61 49 L63 63 L50 56 L37 63 L39 49 L29 39 L43 37 Z" fill="#e0b76a"/><path d="M50 76 L58 76 L62 88 L50 82 Z" fill="#d6a754"/></svg></div>
    <div class="nk-head-txt"><b>Naksha</b><span>your companion for daily dilemmas</span></div>
    <button class="nk-close" id="nk-close" type="button" aria-label="Close">&times;</button>
  </div>
  <div class="nk-body" id="nk-body">
    <div class="nk-msg nk-bot"><p>Namaste. I’m Naksha — ask me about whatever you’re looking at, or anything about your chart.</p></div>
    <div class="nk-chips" id="nk-chips"></div>
  </div>
  <div class="nk-quota" id="nk-quota"></div>
  <div class="nk-input-row">
    <input type="text" id="nk-input" placeholder="Ask Naksha…" autocomplete="off">
    <button class="nk-send" id="nk-send" type="button" aria-label="Send">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 2 11 13 M22 2 15 22 11 13 2 9 22 2Z"/></svg>
    </button>
  </div>
</div>

<script>
/* Naksha on the kundli page */
(function(){
  var BASE = API_BASE;
  function esc(s){ return String(s==null?'':s).replace(/[&<>]/g,function(m){return{'&':'&amp;','<':'&lt;','>':'&gt;'}[m];}); }

  var fab=document.getElementById('nk-fab'), panel=document.getElementById('nk-panel'),
      closeBtn=document.getElementById('nk-close'), body=document.getElementById('nk-body'),
      input=document.getElementById('nk-input'), sendBtn=document.getElementById('nk-send'),
      quota=document.getElementById('nk-quota'), chips=document.getElementById('nk-chips');

  function sessionId(){
    var k='mh-naksha-session',v=null;
    try{v=localStorage.getItem(k);}catch(e){}
    if(!v){v='nk_'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2,10);try{localStorage.setItem(k,v);}catch(e){}}
    return v;
  }
  var SID=sessionId(), history=[], limitReached=false;

  var _nkScrollY = 0, _nkLocked = false;
  function nkLock(){
    if(_nkLocked || !window.matchMedia('(max-width: 640px)').matches) return;
    _nkScrollY = window.scrollY || window.pageYOffset || 0;
    document.documentElement.classList.add('nk-scroll-lock');
    document.body.classList.add('nk-scroll-lock');
    document.body.style.top = (-_nkScrollY) + 'px';
    _nkLocked = true;
  }
  function nkUnlock(){
    if(!_nkLocked) return;
    document.documentElement.classList.remove('nk-scroll-lock');
    document.body.classList.remove('nk-scroll-lock');
    document.body.style.top = '';
    window.scrollTo(0, _nkScrollY);
    _nkLocked = false;
  }
  function open_(){ rebuildChips(); panel.classList.add('is-open'); fab.classList.add('is-hidden'); nkLock(); input.focus(); }
  function close_(){ panel.classList.remove('is-open'); fab.classList.remove('is-hidden'); nkUnlock(); }
  fab.addEventListener('click', open_);
  closeBtn.addEventListener('click', close_);
  window.addEventListener('resize', function(){ if(_nkLocked && !window.matchMedia('(max-width: 640px)').matches) nkUnlock(); });

  function scrollBottom(){ body.scrollTop=body.scrollHeight; }
  function addUserMsg(t){ var d=document.createElement('div');d.className='nk-msg nk-user';d.innerHTML='<p>'+esc(t)+'</p>';body.appendChild(d);scrollBottom(); }
  function addBotMsg(t){ var d=document.createElement('div');d.className='nk-msg nk-bot';d.innerHTML='<p>'+esc(t)+'</p>';body.appendChild(d);scrollBottom();return d; }
  function addTyping(){ var d=document.createElement('div');d.className='nk-msg nk-typing';d.innerHTML='<span class="nk-dots"><i></i><i></i><i></i></span>';body.appendChild(d);scrollBottom();return d; }

  function getContextChips(){
    var active=document.querySelector('.tab.on');
    var tab=active?active.textContent.trim().toLowerCase():'';
    if(tab==='basic') return [{q:"What does my varna mean?",l:"What is varna?"},{q:"What is my nakshatra lord?",l:"What is a nakshatra lord?"},{q:"Explain my panchang",l:"Explain panchang"}];
    if(tab==='kundli') return [{q:"What does my lagna mean?",l:"What does lagna mean?"},{q:"How to read a North Indian chart?",l:"How to read this chart?"},{q:"What planets are strong in my chart?",l:"Which planets are strong?"}];
    if(tab==='kp') return [{q:"What is the KP system?",l:"What is KP?"},{q:"What does sub lord mean?",l:"What is a sub lord?"},{q:"How are ruling planets used?",l:"Ruling planets?"}];
    if(tab==='ashtakvarga') return [{q:"What does Ashtakvarga show?",l:"What is Ashtakvarga?"},{q:"Which signs are strongest for me?",l:"My strongest signs?"},{q:"How to read bindu points?",l:"What are bindus?"}];
    if(tab==='charts') return [{q:"What is the navamsa chart for?",l:"What is navamsa?"},{q:"What does D10 say about my career?",l:"D10 and career?"},{q:"Why are there so many charts?",l:"Why so many charts?"}];
    if(tab==='dasha') return [{q:"What is my current dasha period?",l:"My current dasha?"},{q:"What will the next dasha bring?",l:"What is next?"},{q:"How long does each dasha last?",l:"Dasha lengths?"}];
    if(tab==='report') return [{q:"Is this prediction reliable?",l:"Is this reliable?"},{q:"What should I focus on this year?",l:"Focus this year?"},{q:"What remedies help during my dasha?",l:"Any remedies?"}];
    return [{q:"What is a kundli?",l:"What is a kundli?"},{q:"What does my chart say about me?",l:"What does my chart say?"}];
  }

  function wireChip(b){
    b.addEventListener('click',function(){
      send(b.getAttribute('data-q'));
    });
  }

  function rebuildChips(){
    var defs=getContextChips();
    chips.innerHTML='';
    defs.forEach(function(d){
      var b=document.createElement('button');b.className='nk-chip';
      b.setAttribute('data-q',d.q);b.textContent=d.l;wireChip(b);chips.appendChild(b);
    });
  }
  rebuildChips();

  function appendChipRow(){
    body.querySelectorAll('.nk-chips-inline').forEach(function(el){el.remove();});
    var defs=getContextChips();
    var row=document.createElement('div');row.className='nk-chips nk-chips-inline';
    defs.forEach(function(d){
      var b=document.createElement('button');b.className='nk-chip';
      b.setAttribute('data-q',d.q);b.textContent=d.l;wireChip(b);row.appendChild(b);
    });
    body.appendChild(row);scrollBottom();
  }

  function setQuota(r){ if(r==null)return; quota.textContent=r>0?r+' free question'+(r===1?'':'s')+' left today':"Today's free questions are used"; }

  function send(text){
    text=(text||'').trim();if(!text||limitReached)return;
    if(!(window.mhAuth && window.mhAuth.user())){
      addUserMsg(text);
      addBotMsg("Sign in with Google to chat with me — 5 free questions a day, tied to your account.");
      var sb=document.createElement('button');sb.className='nk-chip';sb.textContent='Sign in with Google';
      sb.addEventListener('click',function(){window.mhAuth.signInGoogle();});
      body.appendChild(sb);scrollBottom();
      return;
    }
    chips.style.display='none';addUserMsg(text);
    history.push({role:'user',content:text});input.value='';sendBtn.disabled=true;
    var typing=addTyping();
    window.mhApiFetch(BASE+'/api/naksha/chat',{
      body:{ messages:history, context: window.__mhPageContext || null },
      onRetry: function(){ if(typing){ typing.className='nk-msg nk-bot'; typing.innerHTML='<p>Waking the server up — the free tier is slow on the first request. Hang on…</p>'; scrollBottom(); } }
    })
      .then(function(d){
        typing.remove();addBotMsg(d.reply);history.push({role:'assistant',content:d.reply});
        setQuota(d.remaining_today);
        if(d.limit_reached){limitReached=true;input.placeholder='Come back tomorrow';} else {appendChipRow();}
      })
      .catch(function(e){typing.remove();
        var msg;
        if(e&&e.code==='unauthorized') msg="Your sign-in expired — please sign in again.";
        else if(e&&(window.MH_ERR&&window.MH_ERR[e.code])) msg=window.MH_ERR[e.code];
        else if(e&&e.message&&e.message.indexOf('Naksha')===0) msg=e.message;
        else msg="Couldn't reach Naksha right now.";
        addBotMsg(msg);if(!limitReached)appendChipRow();
      })
      .then(function(){sendBtn.disabled=false;});
  }

  sendBtn.addEventListener('click',function(){send(input.value);});
  input.addEventListener('keydown',function(e){if(e.key==='Enter')send(input.value);});

  /* ---------- proactive nudges: Naksha notices which tab you're on ---------- */
  var TAB_NUDGE = {
    basic:       ['Naksha is looking', 'Want me to walk you through what these birth attributes mean?'],
    kundli:      ['Naksha is looking', 'Want me to read your birth chart for you?'],
    kp:          ['Naksha is looking', 'Curious what the KP cusps add to the picture? Ask me.'],
    ashtakvarga: ['Naksha is looking', 'Want me to explain what your Ashtakvarga scores actually mean?'],
    charts:      ['Naksha is looking', 'Want me to tell you what your D9 and other divisional charts show?'],
    dasha:       ['Naksha is looking', "Want me to explain the planetary period you're in right now?"],
    report:      ['Naksha is looking', 'Want me to talk through any part of this reading?']
  };
  var nudgeEl=null, nudgeTimer=null, nudgesOff=false;
  function clearNudge(){
    if(nudgeTimer){ clearTimeout(nudgeTimer); nudgeTimer=null; }
    if(nudgeEl){
      var el=nudgeEl; nudgeEl=null; el.classList.remove('is-in');
      setTimeout(function(){ if(el.parentNode) el.parentNode.removeChild(el); }, 320);
    }
  }
  function nudge(kicker, question){
    if(nudgesOff || panel.classList.contains('is-open')) return;
    var seen='mh-nk-nudge-'+question.slice(0,28);
    try{ if(sessionStorage.getItem(seen)) return; }catch(e){}
    clearNudge();
    var el=document.createElement('div');
    el.className='nk-nudge';
    el.innerHTML='<button class="nk-nudge-x" type="button" aria-label="Not now">&times;</button>'
      +'<b>'+esc(kicker)+'</b><span class="nk-think" aria-hidden="true"><i></i><i></i><i></i></span>';
    document.body.appendChild(el); nudgeEl=el;
    requestAnimationFrame(function(){ el.classList.add('is-in'); });
    el.querySelector('.nk-nudge-x').addEventListener('click', function(ev){
      ev.stopPropagation(); nudgesOff=true; clearNudge();
    });
    setTimeout(function(){
      if(nudgeEl!==el) return;
      var q=document.createElement('span'); q.textContent=question;
      var t=el.querySelector('.nk-think'); if(t) t.replaceWith(q);
    }, 950);
    el.addEventListener('click', function(){
      try{ sessionStorage.setItem(seen,'1'); }catch(e){}
      clearNudge(); open_(); send(question);
    });
    nudgeTimer=setTimeout(function(){
      try{ sessionStorage.setItem(seen,'1'); }catch(e){}
      clearNudge();
    }, 11000);
  }
  window.mhNaksha = {
    open: open_,
    ask: function(q){ open_(); send(q); },
    nudgeForTab: function(id){ var t=TAB_NUDGE[id]; if(t) nudge(t[0], t[1]); }
  };
})();
</script>
</body>
</html>
